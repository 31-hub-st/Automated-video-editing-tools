# Fast source and contract gate for the current StoryForge v1.x line.
name: fast-pr

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check Python, JavaScript and whitespace syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'test-results/fast-pr' | Out-Null
          python -m compileall -q storyforge scripts tests 2>&1 |
            Tee-Object -FilePath 'test-results/fast-pr/python-syntax.log'
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed.' }
          node --check ui/app.js 2>&1 |
            Tee-Object -FilePath 'test-results/fast-pr/javascript-syntax.log'
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed.' }
          $powerShellFiles = @(
            'scripts/bootstrap_storyforge.ps1',
            'scripts/publish_hub_snapshot.ps1',
            'scripts/verify_storyforge_deployment.ps1'
          )
          foreach ($file in $powerShellFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax check failed for $file`: $($errors -join '; ')"
            }
          }
          git diff --check 2>&1 |
            Tee-Object -FilePath 'test-results/fast-pr/whitespace.log'
          if ($LASTEXITCODE -ne 0) { throw 'Git whitespace check failed.' }

      - name: Run fast production contracts
        shell: pwsh
        run: >-
          python scripts/run_test_gate.py
          --name fast-pr
          --output-dir test-results/fast-pr
          -- tests.test_release_gate tests.test_stability_acceptance
          tests.test_production_workflow tests.test_ui_contract
          tests.test_bootstrap_contract tests.test_startup

      - name: Upload fast-gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-pr-summary-${{ github.run_id }}
          path: test-results/fast-pr
          if-no-files-found: warn
          retention-days: 14
