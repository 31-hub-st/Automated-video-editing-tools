# StoryForge v1.x source metadata; the application version is read dynamically.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge-studio"
dynamic = ["version"]
description = "Local-first batch studio for narrated vertical novel videos"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.6,<1",
  "pywebview==6.2.1",
  "pythonnet==3.1.0; sys_platform == 'win32'",
  "clr-loader==0.3.1; sys_platform == 'win32'",
]

[project.scripts]
storyforge = "storyforge.main:main"

[tool.setuptools]
packages = ["storyforge", "storyforge.services", "storyforge.providers"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "storyforge.__version__"}
